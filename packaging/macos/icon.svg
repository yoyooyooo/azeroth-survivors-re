<!-- The app icon: web/favicon.svg's blade badge, inset to the macOS icon grid (the artwork is
     drawn in a 64-unit box; 6 units of margin on each side is the ~90 % body macOS icons use).
     Rendered once into icon-1024.png with `rsvg-convert -w 1024 -h 1024`; the bundle script
     scales that PNG into an .iconset, so a runner needs no SVG renderer. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#c88a12"/>
    </linearGradient>
  </defs>
  <g transform="translate(6 6) scale(0.8125)">
    <circle cx="32" cy="32" r="30" fill="#140c06" stroke="#7a5a22" stroke-width="3"/>
    <g fill="url(#g)" stroke="#2a1806" stroke-width="1.4" stroke-linejoin="round">
      <path d="M15 13 L19 13 L45 39 L42 42 Z"/>
      <path d="M49 13 L45 13 L19 39 L22 42 Z"/>
      <path d="M38 37 L44 43 L41 46 L35 40 Z"/>
      <path d="M26 37 L20 43 L23 46 L29 40 Z"/>
      <circle cx="45" cy="48" r="3.4"/>
      <circle cx="19" cy="48" r="3.4"/>
    </g>
  </g>
</svg>
